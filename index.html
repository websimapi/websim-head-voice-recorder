<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Head Voice Recorder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Head Voice Recorder</h1>
    <p class="description">
      Record your voice and hear it how you normally hear it internally! 
      This simulates the bone conduction effect that makes your voice sound different to yourself.
      Click the button below to start - you'll be asked for microphone permissions.
    </p>
    
    <div class="controls">
      <button id="recordButton" class="button">
        <svg class="mic-icon" viewBox="0 0 24 24" width="24" height="24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
        Start Recording
      </button>
      <div id="timer" class="timer">00:00</div>
    </div>

    <div class="visualizer-container">
      <canvas id="visualizer"></canvas>
    </div>

    <div id="recordings" class="recordings">
      <h2>Your Recordings</h2>
      <div id="recordingsList"></div>
    </div>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="audio-processor.js"></script>
  <script src="app.js"></script>

</body>
</html>
